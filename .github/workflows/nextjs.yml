name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main", "feature/monorepo"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      # Debug step - show directory structure
      - name: Debug initial structure
        run: |
          echo "Root directory contents:"
          ls -la
          echo "App directory contents:"
          ls -la app/
          echo "ESG Dashboard directory contents:"
          ls -la esg-dashboard/
          
      # Build dashboard first
      - name: Install dashboard dependencies
        run: |
          cd esg-dashboard
          npm ci
          
      - name: Build dashboard
        run: |
          cd esg-dashboard
          npm run build
          echo "Dashboard build output:"
          ls -la
          
      # Then build main site
      - name: Install main site dependencies
        run: |
          cd app
          npm ci
          
      - name: Build main site
        run: |
          cd app
          npm run build
          echo "Main site build output:"
          ls -la
          
      # Combine outputs
      - name: Combine builds
        run: |
          mkdir -p out/esg-dashboard
          echo "Copying main site files..."
          cp -r app/dist/* out/ || echo "Failed to copy main site files"
          
          echo "Copying dashboard files..."
          if [ -d "esg-dashboard/out" ]; then
            cp -r esg-dashboard/out/* out/esg-dashboard/
          elif [ -d "esg-dashboard/dist" ]; then
            cp -r esg-dashboard/dist/* out/esg-dashboard/
          else
            echo "No build output found for dashboard"
            exit 1
          fi
          
      # Debug final structure
      - name: Debug directory structure
        run: |
          echo "Final out directory contents:"
          ls -la out/
          echo "Final esg-dashboard directory contents:"
          ls -la out/esg-dashboard/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4