name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main", "feature/monorepo"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      # Build main site
      - name: Install main site dependencies
        run: |
          cd app
          npm ci
      - name: Build main site
        run: |
          cd app
          npm run build
          
      # Build dashboard
      - name: Install dashboard dependencies
        run: |
          cd esg-dashboard
          npm ci
      - name: Build dashboard
        run: |
          cd esg-dashboard
          npm run build
        
      # Combine outputs
      - name: Combine builds
        run: |
          mkdir -p out/esg-dashboard
          cp -r app/dist/* out/
          cp -r esg-dashboard/out/* out/esg-dashboard/
          
      # Debug step
      - name: Debug directory structure
        run: |
          echo "Contents of out directory:"
          ls -la out/
          echo "Contents of out/esg-dashboard directory:"
          ls -la out/esg-dashboard/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4